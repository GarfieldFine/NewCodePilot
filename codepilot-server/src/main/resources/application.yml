server:
  port: 8080

spring:
  application:
    name: codepilot-server
  codec:
    max-in-memory-size: 10MB

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Datasource (MySQL)
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/codepilot?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  sql:
    init:
      mode: always
      continue-on-error: true

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# GitHub
github:
  token: ${GITHUB_TOKEN:}
  api:
    base-url: https://api.github.com
  rate-limit:
    max-retries: 3
    retry-delay-ms: 1000

# AI Providers
ai:
  default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      api-url: https://api.openai.com/v1/chat/completions
      model: gpt-4o
      max-tokens: 4096
      temperature: 0.3
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      api-url: https://api.deepseek.com/chat/completions
      model: deepseek-chat
      max-tokens: 4096
      temperature: 0.3
    claude:
      api-key: ${CLAUDE_API_KEY:}
      api-url: https://api.anthropic.com/v1/messages
      model: claude-sonnet-4-6
      max-tokens: 4096
      temperature: 0.3
    qwen:
      api-key: ${QWEN_API_KEY:}
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      model: qwen-plus
      max-tokens: 4096
      temperature: 0.3
    siliconflow:
      api-key: ${SILICONFLOW_API_KEY:}
      api-url: https://api.siliconflow.cn/v1/chat/completions
      model: Qwen/Qwen3.6-35B-A3B
      max-tokens: 4096
      temperature: 0.3

# Review Config
review:
  max-files-per-chunk: 10
  max-diff-lines-per-chunk: 500
  cache-ttl-minutes: 30

# Logging
logging:
  level:
    com.codepilot: debug
    org.springframework.web: info
